name: 云端计算

on:
  workflow_dispatch:
    inputs:
      command:
        description: 计算命令（encode 算编码+指标 / optimize 优化布局）
        type: choice
        options:
          - encode
          - optimize
        default: encode
      scheme:
        description: 方案文件名（拼音名如 yuling.yaml/mswb.yaml/zhengma.yaml；fetch.sh 已拉的中文名如 米十五笔.yaml 也支持）
        required: true
        default: yuling.yaml
      encodables:
        description: 频率序列表文件（-e），留空则尝试用同名 .txt
        required: false
        default: ''
      threads:
        description: optimize 使用的线程数
        required: false
        default: '4'
      optimize_seconds:
        description: optimize 最大运行秒数（超时自动结束）
        required: false
        default: '120'

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout libchai
        uses: actions/checkout@v4

      - name: 下载静态资源与示例方案
        run: |
          chmod +x fetch.sh
          ./fetch.sh

      - name: 拉取用户指定方案（多源回退）
        run: |
          S="${{ inputs.scheme }}"
          # 1) fetch.sh 可能已下载到 examples/（中文名，如 米十五笔.yaml）
          if [ -f "examples/$S" ]; then
            cp "examples/$S" "./$S"
            echo "使用本地 examples/$S"
          fi
          # 2) 回退到 github.io/examples（拼音名，如 yuling.yaml / mswb.yaml，覆盖全部方案）
          if [ ! -f "$S" ]; then
            curl -fsSL -o "$S" "https://raw.githubusercontent.com/hanzi-chai/hanzi-chai.github.io/main/examples/$S" || true
          fi
          # 3) 仍找不到则报错退出（给出可用名提示）
          if [ ! -f "$S" ]; then
            echo "::error::找不到方案 $S。可用名示例：yuling.yaml / mswb.yaml / zhengma.yaml / tianma.yaml（github.io/examples 拼音名），或 米十五笔.yaml（fetch.sh 已拉）"
            exit 1
          fi
          echo "已就位方案：$S"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-libchai-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-libchai-

      - name: 编译 chai
        run: cargo build --release

      - name: 执行 encode
        if: ${{ inputs.command == 'encode' }}
        run: |
          ARGS=""
          S="${{ inputs.scheme }}"
          E="${{ inputs.encodables }}"
          if [ -z "$E" ] && [ -f "${S%.yaml}.txt" ]; then E="${S%.yaml}.txt"; fi
          if [ -n "$E" ]; then ARGS="-e $E"; fi
          ./target/release/chai encode "$S" $ARGS

      - name: 执行 optimize
        if: ${{ inputs.command == 'optimize' }}
        run: |
          timeout "${{ inputs.optimize_seconds }}" ./target/release/chai optimize "${{ inputs.scheme }}" -t "${{ inputs.threads }}" || true
